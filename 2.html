<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        } */
        .main{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3,fr);
            width:600px;
            height:200px ;
            height: 50vh;
            width: 50vh;
            /* border: 2px solid blue; */
        }
        .main div{
            border: 2px solid black;
            padding:8px ;
            font-size: 50px;
        }
        .item-5{
           grid-column-start: 1;
           grid-column-end: 3;
        }
        header{
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start:1;
            grid-row-end: 5;
        }
        .one{
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 5;
        }
    </style>
</head>
<body>
    <div class="main">
       <div class="main one">1</div>
       <div class=" main">2</div>
       <div class="main 3">3</div>
       <div class="main 4">4</div>
       <div class="main 5">5</div>
       <div class="main 6">6</div>
       <div class="main 7">7</div>
       <div class="main 8">8</div>
    </div>
</body>
</html>
